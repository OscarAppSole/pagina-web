<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo a Discord...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #5865f2, #7289da);
            color: white;
            text-align: center;
            padding: 50px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            font-size: 18px;
            margin: 20px 0;
        }
        .manual-link {
            background: white;
            color: #5865f2;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h1>Conectando con Discord...</h1>
    <p class="message">Te estamos redirigiendo para autorizar a Soledad Bot</p>
    <p>Si no se abre automáticamente, <a href="#" onclick="openDiscord()" class="manual-link">haz clic aquí</a></p>

    <script>
        function openDiscord() {
            window.location.href = 'https://discord.com/oauth2/authorize?client_id=766405066860527688&permissions=8&integration_type=0&scope=bot';
        }

        // Intentar abrir en nueva pestaña
        setTimeout(function() {
            try {
                const newWindow = window.open('https://discord.com/oauth2/authorize?client_id=766405066860527688&permissions=8&integration_type=0&scope=bot', '_blank');
                if (newWindow) {
                    // Si se abrió, cerrar esta página
                    window.close();
                } else {
                    // Si no se pudo abrir, redirigir en la misma pestaña
                    openDiscord();
                }
            } catch (e) {
                // Fallback: redirigir en la misma pestaña
                openDiscord();
            }
        }, 1000);
    </script>
</body>
</html>
